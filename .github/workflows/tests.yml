name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest
      - run: python -m build
      - run: |
          python -m venv /tmp/installed-tool
          /tmp/installed-tool/bin/pip install dist/*.whl
          cd /tmp
          /tmp/installed-tool/bin/min-cost-itp --version
