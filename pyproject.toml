[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "min-cost-itp"
version = "0.1.0"
description = "Exact minimum-cost interpolation variable selection for DIMACS CNF pairs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["python-sat==1.8.dev24"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
min-cost-itp = "min_cost_itp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
